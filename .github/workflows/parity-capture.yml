name: Capture parity baseline
on:
  push:
    branches: [design/approved-reference-parity]
    paths: [.github/workflows/parity-capture.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Capture live site and source
        run: |
          mkdir -p qa-before/source
          cp index.html qa-before/source/
          cp -r assets qa-before/source/
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import json
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for width,height in [(1430,1034),(1920,1080),(768,1024),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                  errors=[]
                  page.on('pageerror',lambda error: errors.append(str(error)))
                  response=page.goto('https://baby-gift-list.vercel.app/',wait_until='networkidle')
                  page.evaluate('document.fonts.ready')
                  page.screenshot(path=f'qa-before/before-{width}.png',full_page=True)
                  results.append({'width':width,'status':response.status,'title':page.title(),'errors':errors,'overflow':page.evaluate('document.documentElement.scrollWidth>innerWidth')})
                  page.close()
              browser.close()
          with open('qa-before/report.json','w') as f: json.dump(results,f,indent=2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parity-baseline
          path: qa-before
          retention-days: 7
