name: Verify approved lettering vectors
on:
  push:
    branches: [design/crisp-approved-lettering]
    paths:
      - scripts/vectorize_type.py
      - .github/workflows/vector-lettering.yml
permissions:
  contents: write
jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install image and browser checks
        run: |
          python -m pip install Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Vectorize lettering without changing layouts
        run: |
          python scripts/vectorize_type.py
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re
          expected = {'brand','headline','tagline','browse-heading','thank-you','heading-travel','heading-nursery','heading-bath','heading-clothing','heading-diapering','heading-feeding','heading-health','heading-playtime'}
          folder = Path('assets/type')
          assert {x.stem for x in folder.glob('*.svg')} == expected
          for asset in folder.glob('*.svg'):
              doc = ET.parse(asset)
              assert doc.getroot().tag.endswith('svg')
              assert asset.stat().st_size < 50000
          assert 'assets/type/headline.svg' in Path('index.html').read_text()
          print('Verified 13 scalable letter treatments.')
          PY
      - name: Browser interaction and responsive screenshot checks
        run: python tests/browser_check.py --output qa-vector-type
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vector-lettering-browser-qa
          path: qa-vector-type
          if-no-files-found: warn
          retention-days: 14
      - name: Commit passing assets to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js assets/type
          if ! git diff --cached --quiet; then
            git commit -m "Replace raster lettering with crisp approved-form SVG traces"
            git push origin HEAD:design/crisp-approved-lettering
          fi
