name: Final approved-artwork verification
on:
  push:
    branches: [design/approved-reference-parity]
    paths: [.github/workflows/import-approved-release.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply reviewed foliage crop cleanup
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,base64
          p=pathlib.Path('assets/approved/left-edge-tree.webp')
          encoded=''
          encoded=encoded.replace('KPHc3PBw','KPHcPBw')
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='11f636c532a5310e53dd44e79066d683e39a3bfc3d1c6e385556b1663e996055'
          p.write_bytes(raw)
          m=pathlib.Path('assets/approved/manifest.json');a=json.loads(m.read_text())
          a['assets']['left-edge-tree'].update({'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'cleanup':'Retain only the original tree; remove disconnected adjacent UI pixels.'})
          m.write_text(json.dumps(a,indent=2)+'\n')
          r=pathlib.Path('release-manifest.json');v=json.loads(r.read_text())
          for name in v:v[name]=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
          r.write_text(json.dumps(v,indent=2)+'\n')
          print('Reviewed original foliage cleaned; manifests refreshed.')
          PY
      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify the complete website
        run: python tests/browser_check.py --output qa-final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: approved-final-browser-evidence
          path: qa-final
          retention-days: 14
      - name: Commit verified artwork correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/approved/left-edge-tree.webp assets/approved/manifest.json release-manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Clean original tree crop and verify final reference layout'
          python - <<'PY'
          import os,subprocess,base64
          env=os.environ.copy()
          header='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+env.pop('GH_TOKEN')).encode()).decode()
          env.update({'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':header})
          subprocess.run(['git','push','origin','HEAD:design/approved-reference-parity'],env=env,check=True)
          PY
